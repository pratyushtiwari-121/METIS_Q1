services:
  - type: web
    name: metis-q1-backend
    runtime: python
    rootDir: backend
    pythonVersion: "3.11.9"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: '["https://metis-q1.vercel.app"]'
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:///./database/quantum_security.db
    plan: free
